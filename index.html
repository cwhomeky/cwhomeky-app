<!-- Auth / Gating Modal Overlay -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAuthModal()">&times;</button>
      <h3>Unlock Military Relocation Vault</h3>
      <p>Sign in to access all downloadable relocation checklists and saved search tools.</p>
      
      <!-- Google Sign In Button -->
      <button id="google-auth-btn" class="btn btn-block" style="background:#4285F4; color:#fff; margin:12px 0;">
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>

      <div style="text-align:center; margin:10px 0; color:#888; font-size:0.85rem;">— OR USE EMAIL —</div>

      <form id="auth-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="auth-name" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="auth-email" required placeholder="name@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="auth-password" required placeholder="••••••••" minlength="6">
        </div>
        <div class="form-group">
          <label>Military Status / Target Move Date</label>
          <input type="text" id="auth-timeline" placeholder="e.g. Active Army - Inbound Fort Knox Summer 2026">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit-btn">Access Free Guides</button>
        <div id="auth-error" style="color:#dc2626; font-size:0.85rem; margin-top:8px; display:none;"></div>
      </form>
    </div>
  </div>

  <!-- Load App scripts as modules -->
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
